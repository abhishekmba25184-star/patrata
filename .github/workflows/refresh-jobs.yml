name: Refresh jobs and search pages
on:
  schedule:
    - cron: "30 0 * * *"   # 6:00 am India time, every day
    - cron: "30 9 * * *"   # 3:00 pm India time
  workflow_dispatch:
  push:
    paths: ["site.config.json", "scripts/**"]
permissions:
  contents: write
concurrency:
  group: refresh-jobs
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect openings
        run: node scripts/fetch-jobs.mjs
      - name: Rebuild pages
        run: node scripts/build-pages.mjs
      - name: Save changes
        run: |
          git config user.name "jobs-bot"
          git config user.email "jobs-bot@users.noreply.github.com"
          git add -A public
          git diff --cached --quiet && exit 0
          git commit -m "Daily job refresh"
          # Uploads made during the run are fetched first, so the refresh is never lost.
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main; then
              node scripts/build-pages.mjs
              git add -A public
              git diff --cached --quiet || git commit -m "Rebuild pages with latest design"
              git push && exit 0
            else
              git rebase --abort || true
            fi
            sleep 15
          done
          exit 1
